<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="100%" height="auto" style="border-radius: 14px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient (Fintech Warm Ivory) -->
    <linearGradient id="compBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFCFA" />
      <stop offset="100%" stop-color="#F5F3EC" />
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4F788" />
      <stop offset="100%" stop-color="#C6F36A" />
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CEF3DA" />
      <stop offset="100%" stop-color="#B8E8C8" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#171A17" flood-opacity="0.05" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#171A17" flood-opacity="0.03" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1100" height="360" rx="14" fill="url(#compBgGrad)" stroke="#E5E3D8" stroke-width="1.5" />

  <!-- Section Header -->
  <g transform="translate(48, 38)">
    <text x="0" y="0" font-size="11" font-weight="700" fill="#62685F" letter-spacing="1.5">BEFORE &amp; AFTER BILLGUARD</text>
    <text x="0" y="24" font-size="22" font-weight="800" fill="#171A17" letter-spacing="-0.5">Electricity bills should be understandable.</text>
  </g>

  <!-- LEFT CARD: WITHOUT BILLGUARD -->
  <g transform="translate(48, 86)" filter="url(#cardShadow)">
    <rect width="486" height="236" rx="12" fill="#FFFFFF" stroke="#EAE8DF" stroke-width="1.5" />
    
    <!-- Top Pill -->
    <rect x="22" y="18" width="168" height="26" rx="13" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1" />
    <circle cx="34" cy="31" r="5" fill="#EF4444" />
    <text x="46" y="35" font-size="11" font-weight="700" fill="#B91C1C" letter-spacing="0.5">WITHOUT BILLGUARD</text>
    
    <!-- Points List -->
    <g transform="translate(24, 62)">
      <!-- Item 1 -->
      <circle cx="10" cy="10" r="7" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5" />
      <path d="M 7 7 L 13 13 M 13 7 L 7 13" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round" />
      <text x="28" y="14" font-size="13" font-weight="600" fill="#171A17">Confusing billing figures</text>
      <text x="28" y="28" font-size="11" fill="#62685F">Unclear breakdown of energy charges, customer fees, and surcharges</text>

      <!-- Item 2 -->
      <circle cx="10" cy="50" r="7" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5" />
      <path d="M 7 47 L 13 53 M 13 47 L 7 53" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round" />
      <text x="28" y="54" font-size="13" font-weight="600" fill="#171A17">Difficult-to-follow tariff calculations</text>
      <text x="28" y="68" font-size="11" fill="#62685F">Complex telescopic slabs make manual verification practically impossible</text>

      <!-- Item 3 -->
      <circle cx="10" cy="90" r="7" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5" />
      <path d="M 7 87 L 13 93 M 13 87 L 7 93" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round" />
      <text x="28" y="94" font-size="13" font-weight="600" fill="#171A17">Uncertainty about possible discrepancies</text>
      <text x="28" y="108" font-size="11" fill="#62685F">Consumers pay unverified amounts without knowing if they were overcharged</text>

      <!-- Item 4 -->
      <circle cx="10" cy="130" r="7" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5" />
      <path d="M 7 127 L 13 133 M 13 127 L 7 133" stroke="#DC2626" stroke-width="1.5" stroke-linecap="round" />
      <text x="28" y="134" font-size="13" font-weight="600" fill="#171A17">Time-consuming complaint preparation</text>
      <text x="28" y="148" font-size="11" fill="#62685F">Daunting legal forms and regulatory citations discourage consumer action</text>
    </g>
  </g>

  <!-- RIGHT CARD: WITH BILLGUARD -->
  <g transform="translate(566, 86)" filter="url(#cardShadow)">
    <rect width="486" height="236" rx="12" fill="#FFFFFF" stroke="#D1E7B7" stroke-width="2" />
    
    <!-- Top Pill -->
    <rect x="22" y="18" width="144" height="26" rx="13" fill="url(#limeGrad)" stroke="#A3E635" stroke-width="1" />
    <circle cx="34" cy="31" r="5" fill="#171A17" />
    <text x="46" y="35" font-size="11" font-weight="700" fill="#171A17" letter-spacing="0.5">WITH BILLGUARD</text>
    
    <!-- Points List -->
    <g transform="translate(24, 62)">
      <!-- Item 1 -->
      <circle cx="10" cy="10" r="7" fill="url(#limeGrad)" />
      <path d="M 7 10 L 9 12 L 13 8" fill="none" stroke="#171A17" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <text x="28" y="14" font-size="13" font-weight="700" fill="#171A17">Structured bill information</text>
      <text x="28" y="28" font-size="11" fill="#62685F">AI-assisted extraction turns raw scans into clean, verifiable fields</text>

      <!-- Item 2 -->
      <circle cx="10" cy="50" r="7" fill="url(#limeGrad)" />
      <path d="M 7 50 L 9 52 L 13 48" fill="none" stroke="#171A17" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <text x="28" y="54" font-size="13" font-weight="700" fill="#171A17">Transparent expected-versus-actual comparison</text>
      <text x="28" y="68" font-size="11" fill="#62685F">Unit-by-unit evaluation against official APERC retail tariff orders</text>

      <!-- Item 3 -->
      <circle cx="10" cy="90" r="7" fill="url(#limeGrad)" />
      <path d="M 7 90 L 9 92 L 13 88" fill="none" stroke="#171A17" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <text x="28" y="94" font-size="13" font-weight="700" fill="#171A17">Clear explanations of potential differences</text>
      <text x="28" y="108" font-size="11" fill="#62685F">Plain-language explanations localized in English, Telugu, and Hindi</text>

      <!-- Item 4 -->
      <circle cx="10" cy="130" r="7" fill="url(#limeGrad)" />
      <path d="M 7 130 L 9 132 L 13 128" fill="none" stroke="#171A17" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <text x="28" y="134" font-size="13" font-weight="700" fill="#171A17">A draft complaint consumers can review</text>
      <text x="28" y="148" font-size="11" fill="#62685F">Pre-filled formal CGRF petition citing tariff schedules ready to export</text>
    </g>
  </g>
</svg>
