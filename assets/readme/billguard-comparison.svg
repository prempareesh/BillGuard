<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 360" width="100%" height="auto" style="border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="compBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041F18" />
      <stop offset="50%" stop-color="#021C15" />
      <stop offset="100%" stop-color="#052920" />
    </linearGradient>
    <linearGradient id="badCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241416" />
      <stop offset="100%" stop-color="#180B0D" />
    </linearGradient>
    <linearGradient id="goodCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08382B" />
      <stop offset="100%" stop-color="#04231A" />
    </linearGradient>
    <filter id="compShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1100" height="360" rx="12" fill="url(#compBg)" />

  <!-- Subtitle Header -->
  <g transform="translate(48, 36)">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#34D399" letter-spacing="1.5">CONSUMER REALITY VS. VERIFIED CLARITY</text>
    <text x="0" y="24" font-size="20" font-weight="800" fill="#FFFFFF">How BillGuard Transforms the Utility Billing Experience</text>
  </g>

  <!-- LEFT CARD: WITHOUT BILLGUARD -->
  <g transform="translate(48, 80)" filter="url(#compShadow)">
    <rect width="486" height="245" rx="10" fill="url(#badCardGrad)" stroke="#EF4444" stroke-opacity="0.3" stroke-width="1.5" />
    
    <!-- Header Badge -->
    <rect x="20" y="18" width="140" height="26" rx="13" fill="#3B1215" stroke="#EF4444" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="34" cy="31" r="5" fill="#EF4444" />
    <text x="46" y="35" font-size="11" font-weight="700" fill="#FCA5A5" letter-spacing="0.5">WITHOUT BILLGUARD</text>
    
    <!-- Pain points list -->
    <g transform="translate(24, 62)">
      <!-- Item 1 -->
      <circle cx="10" cy="10" r="8" fill="#451A1D" stroke="#EF4444" stroke-width="1" />
      <path d="M 7 7 L 13 13 M 13 7 L 7 13" stroke="#FCA5A5" stroke-width="1.5" stroke-linecap="round" />
      <text x="28" y="14" font-size="13" font-weight="600" fill="#FEE2E2">Opaque telescopic slabs</text>
      <text x="28" y="28" font-size="11" fill="#9CA3AF">6 distinct rates make manual calculation practically impossible</text>

      <!-- Item 2 -->
      <circle cx="10" cy="52" r="8" fill="#451A1D" stroke="#EF4444" stroke-width="1" />
      <path d="M 7 49 L 13 55 M 13 49 L 7 55" stroke="#FCA5A5" stroke-width="1.5" stroke-linecap="round" />
      <text x="28" y="56" font-size="13" font-weight="600" fill="#FEE2E2">Hidden surcharges &amp; duty</text>
      <text x="28" y="70" font-size="11" fill="#9CA3AF">Fixed charges and customer charges applied without clear breakdown</text>

      <!-- Item 3 -->
      <circle cx="10" cy="94" r="8" fill="#451A1D" stroke="#EF4444" stroke-width="1" />
      <path d="M 7 91 L 13 97 M 13 91 L 7 97" stroke="#FCA5A5" stroke-width="1.5" stroke-linecap="round" />
      <text x="28" y="98" font-size="13" font-weight="600" fill="#FEE2E2">No dispute mechanism</text>
      <text x="28" y="112" font-size="11" fill="#9CA3AF">Consumers pay unverified bills because official CGRF forms are daunting</text>

      <!-- Item 4 -->
      <circle cx="10" cy="136" r="8" fill="#451A1D" stroke="#EF4444" stroke-width="1" />
      <path d="M 7 133 L 13 139 M 13 133 L 7 139" stroke="#FCA5A5" stroke-width="1.5" stroke-linecap="round" />
      <text x="28" y="140" font-size="13" font-weight="600" fill="#FEE2E2">Language barriers</text>
      <text x="28" y="154" font-size="11" fill="#9CA3AF">Technical tariff jargon without local Telugu or Hindi translation</text>
    </g>
  </g>

  <!-- RIGHT CARD: WITH BILLGUARD -->
  <g transform="translate(566, 80)" filter="url(#compShadow)">
    <rect width="486" height="245" rx="10" fill="url(#goodCardGrad)" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.8" />
    
    <!-- Header Badge -->
    <rect x="20" y="18" width="140" height="26" rx="13" fill="#065F46" stroke="#34D399" stroke-width="1" />
    <circle cx="34" cy="31" r="5" fill="#34D399" />
    <text x="46" y="35" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">WITH BILLGUARD</text>
    
    <!-- Benefits list -->
    <g transform="translate(24, 62)">
      <!-- Item 1 -->
      <circle cx="10" cy="10" r="8" fill="#065F46" stroke="#34D399" stroke-width="1" />
      <path d="M 7 10 L 9 12 L 13 8" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="28" y="14" font-size="13" font-weight="600" fill="#FFFFFF">Unit-by-unit tariff breakdown</text>
      <text x="28" y="28" font-size="11" fill="#A7F3D0">Deterministic evaluation against official APERC Retail Tariff Orders</text>

      <!-- Item 2 -->
      <circle cx="10" cy="52" r="8" fill="#065F46" stroke="#34D399" stroke-width="1" />
      <path d="M 7 52 L 9 54 L 13 50" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="28" y="56" font-size="13" font-weight="600" fill="#FFFFFF">Transparent variance detection</text>
      <text x="28" y="70" font-size="11" fill="#A7F3D0">Instant alert when billed amount exceeds verified APERC math by &gt; ₹25</text>

      <!-- Item 3 -->
      <circle cx="10" cy="94" r="8" fill="#065F46" stroke="#34D399" stroke-width="1" />
      <path d="M 7 94 L 9 96 L 13 92" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="28" y="98" font-size="13" font-weight="600" fill="#FFFFFF">Instant 1-click CGRF dispute draft</text>
      <text x="28" y="112" font-size="11" fill="#A7F3D0">Generates formal grievance letter citing tariff order clause &amp; consumer ID</text>

      <!-- Item 4 -->
      <circle cx="10" cy="136" r="8" fill="#065F46" stroke="#34D399" stroke-width="1" />
      <path d="M 7 136 L 9 138 L 13 134" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <text x="28" y="140" font-size="13" font-weight="600" fill="#FFFFFF">Trilingual explanations (EN / TE / HI)</text>
      <text x="28" y="154" font-size="11" fill="#A7F3D0">Plain-language explanation for every consumer in their native language</text>
    </g>
  </g>
</svg>
