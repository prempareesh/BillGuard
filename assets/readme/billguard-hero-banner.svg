<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="auto" style="border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="60%" stop-color="#022C22" />
      <stop offset="100%" stop-color="#062A20" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F382A" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#062A20" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="12" fill="url(#bgGradient)" />

  <!-- Subtle Grid lines -->
  <g stroke="#10B981" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="76" x2="1200" y2="76" />
    <line x1="0" y1="152" x2="1200" y2="152" />
    <line x1="0" y1="228" x2="1200" y2="228" />
    <line x1="0" y1="304" x2="1200" y2="304" />
    <line x1="200" y1="0" x2="200" y2="380" />
    <line x1="400" y1="0" x2="400" y2="380" />
    <line x1="600" y1="0" x2="600" y2="380" />
    <line x1="800" y1="0" x2="800" y2="380" />
    <line x1="1000" y1="0" x2="1000" y2="380" />
  </g>

  <!-- Decorative Circuit Pulses -->
  <path d="M 60 190 Q 220 190 320 280 T 540 280" fill="none" stroke="#10B981" stroke-opacity="0.25" stroke-width="2" stroke-dasharray="6,6" />
  <circle cx="540" cy="280" r="4" fill="#34D399" opacity="0.6" />

  <!-- Left Column: Branding & Headline -->
  <g transform="translate(64, 52)">
    <!-- Shield & Brand Icon -->
    <g transform="translate(0, 0)">
      <rect width="44" height="44" rx="10" fill="#065F46" stroke="#10B981" stroke-width="1.5" />
      <!-- Shield Path -->
      <path d="M 22 10 L 33 14 V 22 C 33 28 28 33 22 35 C 16 33 11 28 11 22 V 14 Z" fill="none" stroke="#34D399" stroke-width="2" stroke-linejoin="round" />
      <!-- Pulse / Bolt inside shield -->
      <path d="M 23 15 L 18 23 H 23 L 21 30 L 27 21 H 22 Z" fill="#FBBF24" />
    </g>

    <text x="56" y="28" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">BillGuard</text>
    <text x="160" y="28" font-size="11" font-weight="700" fill="#34D399" letter-spacing="1.5">TRUST IN EVERY UNIT</text>

    <!-- Main Headline -->
    <text x="0" y="95" font-size="42" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">
      Every Unit Accounted For.
    </text>

    <!-- Subtitle -->
    <text x="0" y="132" font-size="18" font-weight="500" fill="#A7F3D0">
      AI-Powered Electricity Bill Auditing &amp; Tariff Verification
    </text>

    <!-- Description -->
    <text x="0" y="165" font-size="13" font-weight="400" fill="#D1FAE5" opacity="0.85">
      Reconciles electricity statements against official APERC retail tariff schedules.
    </text>
    <text x="0" y="186" font-size="13" font-weight="400" fill="#D1FAE5" opacity="0.85">
      Detects hidden discrepancies, calculates true costs, and automates grievance letters.
    </text>

    <!-- Pills / Badges -->
    <g transform="translate(0, 222)">
      <!-- Badge 1: APERC Regulated -->
      <rect x="0" y="0" width="168" height="28" rx="6" fill="#065F46" stroke="#10B981" stroke-opacity="0.4" />
      <circle cx="14" cy="14" r="4" fill="#34D399" />
      <text x="26" y="18" font-size="11" font-weight="600" fill="#ECFDF5">APERC FY 2026-27 Slabs</text>

      <!-- Badge 2: Deterministic -->
      <rect x="180" y="0" width="162" height="28" rx="6" fill="#065F46" stroke="#10B981" stroke-opacity="0.4" />
      <path d="M 194 14 L 197 17 L 202 11" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" />
      <text x="210" y="18" font-size="11" font-weight="600" fill="#ECFDF5">Deterministic Engine</text>

      <!-- Badge 3: AWS Single Table -->
      <rect x="354" y="0" width="144" height="28" rx="6" fill="#065F46" stroke="#10B981" stroke-opacity="0.4" />
      <text x="368" y="18" font-size="11" font-weight="600" fill="#ECFDF5">AWS S3 + DynamoDB</text>
    </g>
  </g>

  <!-- Right Column: Interactive Diagram Card -->
  <g transform="translate(680, 42)" filter="url(#shadow)">
    <!-- Outer Card Frame -->
    <rect width="456" height="296" rx="14" fill="url(#cardGrad)" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.5" />

    <!-- Card Top Header -->
    <rect width="456" height="42" rx="14" fill="#062A20" />
    <circle cx="24" cy="21" r="5" fill="#EF4444" />
    <circle cx="40" cy="21" r="5" fill="#F59E0B" />
    <circle cx="56" cy="21" r="5" fill="#10B981" />
    <text x="80" y="25" font-size="11" font-weight="600" fill="#6EE7B7" letter-spacing="0.5">AUDIT_CERTIFICATE // VERIFIED_STATEMENT</text>
    <rect x="340" y="11" width="96" height="20" rx="4" fill="#065F46" />
    <text x="348" y="24" font-size="10" font-weight="700" fill="#A7F3D0">APSPDCL LT-I</text>

    <!-- Consumer Meta Row -->
    <g transform="translate(24, 60)">
      <text x="0" y="12" font-size="11" font-weight="500" fill="#9CA3AF">Consumer Authority</text>
      <text x="0" y="28" font-size="13" font-weight="700" fill="#FFFFFF">APSPDCL (Tirupati/Nellore)</text>

      <text x="230" y="12" font-size="11" font-weight="500" fill="#9CA3AF">Tariff Schedule</text>
      <text x="230" y="28" font-size="13" font-weight="700" fill="#FCD34D">APERC-TO-2026-27</text>
    </g>

    <line x1="24" y1="104" x2="432" y2="104" stroke="#065F46" stroke-width="1" />

    <!-- Comparison Metric Grid -->
    <g transform="translate(24, 120)">
      <!-- Expected Box -->
      <rect x="0" y="0" width="128" height="68" rx="8" fill="#022C22" stroke="#10B981" stroke-opacity="0.2" />
      <text x="12" y="18" font-size="10" font-weight="600" fill="#94A3B8">APERC EXPECTED</text>
      <text x="12" y="44" font-size="20" font-weight="800" fill="#FFFFFF">₹2,000<tspan font-size="13" font-weight="500" fill="#94A3B8">.45</tspan></text>
      <text x="12" y="60" font-size="9" font-weight="500" fill="#34D399">Telescopic 6 Slabs</text>

      <!-- Actual Billed Box -->
      <rect x="140" y="0" width="128" height="68" rx="8" fill="#022C22" stroke="#10B981" stroke-opacity="0.2" />
      <text x="152" y="18" font-size="10" font-weight="600" fill="#94A3B8">STATEMENT BILLED</text>
      <text x="152" y="44" font-size="20" font-weight="800" fill="#FFFFFF">₹2,850<tspan font-size="13" font-weight="500" fill="#94A3B8">.00</tspan></text>
      <text x="152" y="60" font-size="9" font-weight="500" fill="#94A3B8">320 Units Billed</text>

      <!-- Variance Box -->
      <rect x="280" y="0" width="128" height="68" rx="8" fill="#450A0A" stroke="#EF4444" stroke-opacity="0.4" />
      <text x="292" y="18" font-size="10" font-weight="700" fill="#FCA5A5">VARIANCE (EXCESS)</text>
      <text x="292" y="44" font-size="20" font-weight="800" fill="#F87171">+₹849<tspan font-size="13" font-weight="500" fill="#FCA5A5">.55</tspan></text>
      <text x="292" y="60" font-size="9" font-weight="700" fill="#F87171">Above Statutory Tier</text>
    </g>

    <!-- Bottom Status Strip -->
    <g transform="translate(24, 206)">
      <rect x="0" y="0" width="408" height="66" rx="8" fill="#042F24" stroke="#10B981" stroke-opacity="0.25" />
      
      <!-- Status Badge -->
      <rect x="12" y="12" width="140" height="22" rx="4" fill="#991B1B" />
      <circle cx="22" cy="23" r="3.5" fill="#F87171" />
      <text x="32" y="27" font-size="10" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">POTENTIAL OVERCHARGE</text>

      <text x="160" y="27" font-size="11" font-weight="500" fill="#D1FAE5">Variance exceeds statutory ₹25 threshold</text>

      <!-- Action Footer -->
      <text x="12" y="52" font-size="10" font-weight="600" fill="#6EE7B7">RECOMMENDED ACTION:</text>
      <text x="144" y="52" font-size="10" font-weight="400" fill="#ECFDF5">Automate CGRF Dispute Draft · Export Audit PDF</text>
    </g>
  </g>
</svg>
