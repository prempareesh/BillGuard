<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="auto" style="border-radius: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="wfBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#052E24" />
      <stop offset="50%" stop-color="#022C22" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>
    <linearGradient id="wfCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B3E31" />
      <stop offset="100%" stop-color="#062F25" />
    </linearGradient>
    <linearGradient id="wfActiveCardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F513F" />
      <stop offset="100%" stop-color="#08382B" />
    </linearGradient>
    <filter id="wfCardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="12" fill="url(#wfBgGrad)" />

  <!-- Grid lines -->
  <g stroke="#10B981" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="200" y1="0" x2="200" y2="320" />
    <line x1="400" y1="0" x2="400" y2="320" />
    <line x1="600" y1="0" x2="600" y2="320" />
    <line x1="800" y1="0" x2="800" y2="320" />
    <line x1="1000" y1="0" x2="1000" y2="320" />
  </g>

  <!-- Title Bar -->
  <g transform="translate(48, 38)">
    <rect width="8" height="20" rx="2" fill="#10B981" />
    <text x="18" y="16" font-size="14" font-weight="700" fill="#34D399" letter-spacing="1.2">END-TO-END AUDIT PIPELINE</text>
    <text x="240" y="16" font-size="13" font-weight="400" fill="#94A3B8">|  From raw electricity bill to legally structured CGRF dispute draft</text>
  </g>

  <!-- Flow Connector Bar -->
  <line x1="110" y1="150" x2="1090" y2="150" stroke="#10B981" stroke-opacity="0.25" stroke-width="3" stroke-dasharray="4,4" />

  <!-- STEP 1: Upload Bill -->
  <g transform="translate(48, 85)" filter="url(#wfCardShadow)">
    <rect width="168" height="195" rx="10" fill="url(#wfCardGrad)" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="84" cy="36" r="18" fill="#065F46" stroke="#34D399" stroke-width="1.5" />
    <!-- Upload Icon -->
    <path d="M 84 28 V 44 M 78 34 L 84 28 L 90 34" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="84" y="74" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle" letter-spacing="1">STEP 01</text>
    <text x="84" y="96" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Upload Bill</text>
    <text x="84" y="122" font-size="11" fill="#94A3B8" text-anchor="middle">PDF or Image scan</text>
    <text x="84" y="138" font-size="11" fill="#94A3B8" text-anchor="middle">APSPDCL / APEPDCL</text>
    <rect x="24" y="158" width="120" height="22" rx="4" fill="#022C22" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" />
    <text x="84" y="173" font-size="10" font-weight="600" fill="#6EE7B7" text-anchor="middle">Secure S3 / Local</text>
  </g>

  <!-- STEP 2: Vision OCR Extraction -->
  <g transform="translate(236, 85)" filter="url(#wfCardShadow)">
    <rect width="168" height="195" rx="10" fill="url(#wfCardGrad)" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="84" cy="36" r="18" fill="#065F46" stroke="#34D399" stroke-width="1.5" />
    <!-- Scan / Sparkle Icon -->
    <path d="M 75 31 H 80 M 88 31 H 93 M 75 41 H 80 M 88 41 H 93 M 84 28 L 86 33 L 91 35 L 86 37 L 84 42 L 82 37 L 77 35 L 82 33 Z" fill="#FBBF24" />
    <text x="84" y="74" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle" letter-spacing="1">STEP 02</text>
    <text x="84" y="96" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Vision OCR</text>
    <text x="84" y="122" font-size="11" fill="#94A3B8" text-anchor="middle">Multimodal Gemini</text>
    <text x="84" y="138" font-size="11" fill="#94A3B8" text-anchor="middle">Parses units &amp; charges</text>
    <rect x="24" y="158" width="120" height="22" rx="4" fill="#022C22" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" />
    <text x="84" y="173" font-size="10" font-weight="600" fill="#6EE7B7" text-anchor="middle">Structured JSON</text>
  </g>

  <!-- STEP 3: User Verification -->
  <g transform="translate(424, 85)" filter="url(#wfCardShadow)">
    <rect width="168" height="195" rx="10" fill="url(#wfCardGrad)" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="84" cy="36" r="18" fill="#065F46" stroke="#34D399" stroke-width="1.5" />
    <!-- Checkmark & Edit Icon -->
    <path d="M 77 36 L 82 41 L 91 30" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="84" y="74" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle" letter-spacing="1">STEP 03</text>
    <text x="84" y="96" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Data Review</text>
    <text x="84" y="122" font-size="11" fill="#94A3B8" text-anchor="middle">Consumer inspects</text>
    <text x="84" y="138" font-size="11" fill="#94A3B8" text-anchor="middle">extracted bill fields</text>
    <rect x="24" y="158" width="120" height="22" rx="4" fill="#022C22" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" />
    <text x="84" y="173" font-size="10" font-weight="600" fill="#6EE7B7" text-anchor="middle">Human-in-the-Loop</text>
  </g>

  <!-- STEP 4: Tariff Verification Engine (Highlighted) -->
  <g transform="translate(612, 85)" filter="url(#wfCardShadow)">
    <rect width="168" height="195" rx="10" fill="url(#wfActiveCardGrad)" stroke="#34D399" stroke-width="2" />
    <circle cx="84" cy="36" r="18" fill="#059669" stroke="#6EE7B7" stroke-width="1.5" />
    <!-- Scale / Balance Icon -->
    <path d="M 84 26 V 44 M 75 32 L 84 28 L 93 32 M 75 32 L 73 38 H 77 Z M 93 32 L 91 38 H 95 Z" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round" />
    <text x="84" y="74" font-size="11" font-weight="800" fill="#6EE7B7" text-anchor="middle" letter-spacing="1">STEP 04</text>
    <text x="84" y="96" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle">APERC Engine</text>
    <text x="84" y="122" font-size="11" fill="#D1FAE5" text-anchor="middle">Deterministic math</text>
    <text x="84" y="138" font-size="11" fill="#D1FAE5" text-anchor="middle">Telescopic slabs + duty</text>
    <rect x="24" y="158" width="120" height="22" rx="4" fill="#065F46" stroke="#34D399" stroke-width="1" />
    <text x="84" y="173" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">100% Deterministic</text>
  </g>

  <!-- STEP 5: Discrepancy Classification -->
  <g transform="translate(800, 85)" filter="url(#wfCardShadow)">
    <rect width="168" height="195" rx="10" fill="url(#wfCardGrad)" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="84" cy="36" r="18" fill="#065F46" stroke="#34D399" stroke-width="1.5" />
    <!-- Alert / Shield Icon -->
    <path d="M 84 28 L 93 43 H 75 Z" fill="none" stroke="#FBBF24" stroke-width="2" stroke-linejoin="round" />
    <circle cx="84" cy="39" r="1" fill="#FBBF24" />
    <line x1="84" y1="33" x2="84" y2="36" stroke="#FBBF24" stroke-width="2" stroke-linecap="round" />
    <text x="84" y="74" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle" letter-spacing="1">STEP 05</text>
    <text x="84" y="96" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">Variance Audit</text>
    <text x="84" y="122" font-size="11" fill="#94A3B8" text-anchor="middle">Calculates difference</text>
    <text x="84" y="138" font-size="11" fill="#94A3B8" text-anchor="middle">₹25 dispute threshold</text>
    <rect x="24" y="158" width="120" height="22" rx="4" fill="#022C22" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" />
    <text x="84" y="173" font-size="10" font-weight="600" fill="#6EE7B7" text-anchor="middle">Verified vs Disputed</text>
  </g>

  <!-- STEP 6: Action & Dispute Draft -->
  <g transform="translate(988, 85)" filter="url(#wfCardShadow)">
    <rect width="164" height="195" rx="10" fill="url(#wfCardGrad)" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.5" />
    <circle cx="82" cy="36" r="18" fill="#065F46" stroke="#34D399" stroke-width="1.5" />
    <!-- Document / Send Icon -->
    <path d="M 75 28 H 85 L 90 33 V 44 H 75 Z" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linejoin="round" />
    <path d="M 78 35 H 83 M 78 39 H 87" stroke="#34D399" stroke-width="1.5" stroke-linecap="round" />
    <text x="82" y="74" font-size="11" font-weight="700" fill="#34D399" text-anchor="middle" letter-spacing="1">STEP 06</text>
    <text x="82" y="96" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">CGRF Draft</text>
    <text x="82" y="122" font-size="11" fill="#94A3B8" text-anchor="middle">Bilingual explanation</text>
    <text x="82" y="138" font-size="11" fill="#94A3B8" text-anchor="middle">Pre-filled complaint</text>
    <rect x="22" y="158" width="120" height="22" rx="4" fill="#022C22" stroke="#10B981" stroke-opacity="0.3" stroke-width="1" />
    <text x="82" y="173" font-size="10" font-weight="600" fill="#6EE7B7" text-anchor="middle">Download / Submit</text>
  </g>
</svg>
