<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 260" width="100%" height="auto" style="border-radius: 14px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFCFA" />
      <stop offset="100%" stop-color="#F5F3EC" />
    </linearGradient>
    <linearGradient id="limeAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4F788" />
      <stop offset="100%" stop-color="#C6F36A" />
    </linearGradient>
    <linearGradient id="mintAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CEF3DA" />
      <stop offset="100%" stop-color="#B8E8C8" />
    </linearGradient>
    <filter id="stepShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#171A17" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#171A17" flood-opacity="0.02" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1140" height="260" rx="14" fill="url(#wfBg)" stroke="#E5E3D8" stroke-width="1.5" />

  <!-- Section Subtitle -->
  <g transform="translate(40, 28)">
    <text x="0" y="0" font-size="11" font-weight="700" fill="#62685F" letter-spacing="1.5">FIVE-STAGE VERIFICATION WORKFLOW</text>
    <text x="0" y="20" font-size="18" font-weight="800" fill="#171A17">From electricity bill to clarity.</text>
  </g>

  <!-- Flow Connector Line -->
  <line x1="120" y1="140" x2="1020" y2="140" stroke="#E2E0D4" stroke-width="2" stroke-dasharray="4,4" />

  <!-- STAGE 1: UPLOAD -->
  <g transform="translate(40, 72)" filter="url(#stepShadow)">
    <rect width="192" height="160" rx="10" fill="#FFFFFF" stroke="#E5E3D8" stroke-width="1" />
    <!-- Step Badge -->
    <circle cx="28" cy="28" r="14" fill="#F8F7F2" stroke="#E5E3D8" stroke-width="1" />
    <text x="28" y="32" font-size="11" font-weight="800" fill="#171A17" text-anchor="middle">01</text>
    <text x="50" y="32" font-size="10" font-weight="700" fill="#62685F" letter-spacing="1">UPLOAD</text>
    
    <!-- Icon -->
    <path d="M 28 66 V 52 M 22 58 L 28 52 L 34 58" fill="none" stroke="#171A17" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    
    <text x="20" y="88" font-size="14" font-weight="700" fill="#171A17">Select Bill</text>
    <text x="20" y="108" font-size="11" fill="#62685F">Upload PDF or photo</text>
    <text x="20" y="124" font-size="11" fill="#62685F">of utility statement</text>
    <rect x="20" y="136" width="70" height="16" rx="4" fill="#F0EFEA" />
    <text x="55" y="147" font-size="9" font-weight="600" fill="#62685F" text-anchor="middle">PDF / JPG / PNG</text>
  </g>

  <!-- STAGE 2: EXTRACT -->
  <g transform="translate(252, 72)" filter="url(#stepShadow)">
    <rect width="192" height="160" rx="10" fill="#FFFFFF" stroke="#E5E3D8" stroke-width="1" />
    <circle cx="28" cy="28" r="14" fill="#F8F7F2" stroke="#E5E3D8" stroke-width="1" />
    <text x="28" y="32" font-size="11" font-weight="800" fill="#171A17" text-anchor="middle">02</text>
    <text x="50" y="32" font-size="10" font-weight="700" fill="#62685F" letter-spacing="1">EXTRACT</text>
    
    <!-- Sparkle / Vision Icon -->
    <path d="M 28 48 L 30 54 L 36 56 L 30 58 L 28 64 L 26 58 L 20 56 L 26 54 Z" fill="#171A17" />
    
    <text x="20" y="88" font-size="14" font-weight="700" fill="#171A17">AI Vision OCR</text>
    <text x="20" y="108" font-size="11" fill="#62685F">Multimodal parsing finds</text>
    <text x="20" y="124" font-size="11" fill="#62685F">units, rates, and charges</text>
    <rect x="20" y="136" width="86" height="16" rx="4" fill="#F0EFEA" />
    <text x="63" y="147" font-size="9" font-weight="600" fill="#62685F" text-anchor="middle">Gemini Vision API</text>
  </g>

  <!-- STAGE 3: REVIEW -->
  <g transform="translate(464, 72)" filter="url(#stepShadow)">
    <rect width="192" height="160" rx="10" fill="#FFFFFF" stroke="#E5E3D8" stroke-width="1" />
    <circle cx="28" cy="28" r="14" fill="#F8F7F2" stroke="#E5E3D8" stroke-width="1" />
    <text x="28" y="32" font-size="11" font-weight="800" fill="#171A17" text-anchor="middle">03</text>
    <text x="50" y="32" font-size="10" font-weight="700" fill="#62685F" letter-spacing="1">REVIEW</text>
    
    <!-- Edit Icon -->
    <path d="M 22 62 L 32 52 L 35 55 L 25 65 H 22 Z" fill="none" stroke="#171A17" stroke-width="1.8" stroke-linejoin="round" />
    
    <text x="20" y="88" font-size="14" font-weight="700" fill="#171A17">Check &amp; Correct</text>
    <text x="20" y="108" font-size="11" fill="#62685F">Consumer inspects and</text>
    <text x="20" y="124" font-size="11" fill="#62685F">fine-tunes any value</text>
    <rect x="20" y="136" width="94" height="16" rx="4" fill="#F0EFEA" />
    <text x="67" y="147" font-size="9" font-weight="600" fill="#62685F" text-anchor="middle">Human-in-the-Loop</text>
  </g>

  <!-- STAGE 4: AUDIT (Primary Highlighted Card) -->
  <g transform="translate(676, 72)" filter="url(#stepShadow)">
    <rect width="202" height="160" rx="10" fill="#FFFFFF" stroke="#A3E635" stroke-width="2" />
    <circle cx="28" cy="28" r="14" fill="url(#limeAccent)" />
    <text x="28" y="32" font-size="11" font-weight="800" fill="#171A17" text-anchor="middle">04</text>
    <text x="50" y="32" font-size="10" font-weight="800" fill="#171A17" letter-spacing="1">AUDIT</text>
    
    <!-- Balance Scale Icon -->
    <path d="M 28 48 V 64 M 20 54 L 28 50 L 36 54 M 18 54 L 16 60 H 22 Z M 38 54 L 36 60 H 42 Z" fill="none" stroke="#171A17" stroke-width="1.8" stroke-linejoin="round" />
    
    <text x="20" y="88" font-size="14" font-weight="800" fill="#171A17">Tariff Calculation</text>
    <text x="20" y="108" font-size="11" fill="#171A17">Deterministic APERC</text>
    <text x="20" y="124" font-size="11" fill="#171A17">telescopic slab math</text>
    <rect x="20" y="136" width="96" height="16" rx="4" fill="url(#limeAccent)" />
    <text x="68" y="147" font-size="9" font-weight="700" fill="#171A17" text-anchor="middle">100% Deterministic</text>
  </g>

  <!-- STAGE 5: ACT -->
  <g transform="translate(898, 72)" filter="url(#stepShadow)">
    <rect width="202" height="160" rx="10" fill="#FFFFFF" stroke="#E5E3D8" stroke-width="1" />
    <circle cx="28" cy="28" r="14" fill="#F8F7F2" stroke="#E5E3D8" stroke-width="1" />
    <text x="28" y="32" font-size="11" font-weight="800" fill="#171A17" text-anchor="middle">05</text>
    <text x="50" y="32" font-size="10" font-weight="700" fill="#62685F" letter-spacing="1">ACT</text>
    
    <!-- Document / Checkmark Icon -->
    <path d="M 22 48 H 30 L 34 52 V 64 H 22 Z" fill="none" stroke="#171A17" stroke-width="1.8" stroke-linejoin="round" />
    <path d="M 25 56 H 29 M 25 60 H 31" stroke="#171A17" stroke-width="1.5" stroke-linecap="round" />
    
    <text x="20" y="88" font-size="14" font-weight="700" fill="#171A17">Complaint Draft</text>
    <text x="20" y="108" font-size="11" fill="#62685F">Reviews findings and</text>
    <text x="20" y="124" font-size="11" fill="#62685F">prepares CGRF petition</text>
    <rect x="20" y="136" width="92" height="16" rx="4" fill="#F0EFEA" />
    <text x="66" y="147" font-size="9" font-weight="600" fill="#62685F" text-anchor="middle">Formal CGRF Form</text>
  </g>
</svg>
