<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="100%" height="auto" style="border-radius: 14px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="auditBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFCFA" />
      <stop offset="100%" stop-color="#F5F3EC" />
    </linearGradient>
    <linearGradient id="auditLime" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4F788" />
      <stop offset="100%" stop-color="#C6F36A" />
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#171A17" flood-opacity="0.04" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#171A17" flood-opacity="0.02" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1100" height="280" rx="14" fill="url(#auditBg)" stroke="#E5E3D8" stroke-width="1.5" />

  <!-- Section Header -->
  <g transform="translate(48, 30)">
    <text x="0" y="0" font-size="11" font-weight="700" fill="#62685F" letter-spacing="1.5">RECONCILIATION SUMMARY</text>
    <text x="0" y="20" font-size="18" font-weight="800" fill="#171A17">Tariff calculation at a glance.</text>
    <text x="560" y="20" font-size="11" font-weight="500" fill="#8A9086">Illustrative example • LT-I Domestic (240 units) • Not an actual consumer bill</text>
  </g>

  <!-- 4 Metrics Columns -->
  <!-- 1. Billed Amount -->
  <g transform="translate(48, 75)" filter="url(#boxShadow)">
    <rect width="232" height="165" rx="10" fill="#FFFFFF" stroke="#E5E3D8" stroke-width="1" />
    <text x="24" y="32" font-size="11" font-weight="600" fill="#62685F">BILLED ON STATEMENT</text>
    <text x="24" y="68" font-size="28" font-weight="800" fill="#171A17">₹1,420.00</text>
    <line x1="24" y1="88" x2="208" y2="88" stroke="#F0EFEA" stroke-width="1" />
    <text x="24" y="112" font-size="12" fill="#62685F">Billed Consumption:</text>
    <text x="24" y="130" font-size="13" font-weight="600" fill="#171A17">240 Units (kWh)</text>
    <text x="24" y="148" font-size="11" fill="#8A9086">As stated on utility bill</text>
  </g>

  <!-- 2. APERC Expected Amount -->
  <g transform="translate(304, 75)" filter="url(#boxShadow)">
    <rect width="232" height="165" rx="10" fill="#FFFFFF" stroke="#E5E3D8" stroke-width="1" />
    <text x="24" y="32" font-size="11" font-weight="600" fill="#62685F">APERC CALCULATED</text>
    <text x="24" y="68" font-size="28" font-weight="800" fill="#10B981">₹1,284.00</text>
    <line x1="24" y1="88" x2="208" y2="88" stroke="#F0EFEA" stroke-width="1" />
    <text x="24" y="112" font-size="12" fill="#62685F">Telescopic math + levies:</text>
    <text x="24" y="130" font-size="13" font-weight="600" fill="#171A17">5 Slabs + Duty + Fees</text>
    <text x="24" y="148" font-size="11" fill="#8A9086">100% deterministic rule</text>
  </g>

  <!-- 3. Absolute Variance -->
  <g transform="translate(560, 75)" filter="url(#boxShadow)">
    <rect width="232" height="165" rx="10" fill="#FFFFFF" stroke="#FCA5A5" stroke-width="1.5" />
    <text x="24" y="32" font-size="11" font-weight="700" fill="#DC2626">DETECTED VARIANCE</text>
    <text x="24" y="68" font-size="28" font-weight="800" fill="#DC2626">+₹136.00</text>
    <line x1="24" y1="88" x2="208" y2="88" stroke="#FEE2E2" stroke-width="1" />
    <rect x="24" y="104" width="144" height="22" rx="4" fill="#FEF2F2" />
    <text x="32" y="119" font-size="11" font-weight="700" fill="#DC2626">Potential Overcharge</text>
    <text x="24" y="144" font-size="11" fill="#62685F">Exceeds ₹25 review threshold</text>
  </g>

  <!-- 4. Recommended Action -->
  <g transform="translate(816, 75)" filter="url(#boxShadow)">
    <rect width="236" height="165" rx="10" fill="#FFFFFF" stroke="#A3E635" stroke-width="2" />
    <text x="24" y="32" font-size="11" font-weight="700" fill="#171A17">RECOMMENDED ACTION</text>
    <rect x="24" y="48" width="188" height="34" rx="6" fill="url(#auditLime)" />
    <text x="38" y="70" font-size="13" font-weight="800" fill="#171A17">📄 Review CGRF Draft</text>
    <line x1="24" y1="96" x2="212" y2="96" stroke="#F0EFEA" stroke-width="1" />
    <text x="24" y="118" font-size="12" fill="#62685F">Pre-filled formal petition</text>
    <text x="24" y="136" font-size="12" font-weight="600" fill="#171A17">Citing APERC Schedule</text>
    <text x="24" y="152" font-size="11" fill="#8A9086">Export to PDF or copy text</text>
  </g>
</svg>
